<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Trailing stop mechanics for a buy position">
  <rect width="900" height="460" fill="#0b1220"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="40" font-size="24" font-weight="700" fill="#fff">Aggressive Trailing Stop (Buy example)</text>
    <text x="30" y="64" font-size="14" fill="#9fb3c8">Trailing begins after a small profit, then the SL follows price at a fixed distance.</text>
    <!-- entry -->
    <line x1="60" y1="300" x2="700" y2="300" stroke="#e2e8f0" stroke-width="2"/>
    <text x="710" y="305" font-size="14" fill="#e2e8f0" font-weight="600">Entry price</text>
    <!-- trail start -->
    <line x1="60" y1="260" x2="700" y2="260" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="710" y="265" font-size="13" fill="#fbbf24">Trail start (+TrailStart)</text>
    <!-- initial SL -->
    <line x1="60" y1="360" x2="250" y2="360" stroke="#f87171" stroke-width="2.5"/>
    <text x="710" y="365" font-size="13" fill="#f87171">Initial SL</text>
    <line x1="250" y1="360" x2="250" y2="300" stroke="#f87171" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
    <!-- price path -->
    <polyline points="120,300 170,285 220,270 270,250 320,215 370,200 420,165 470,175 520,140 570,150 620,170 660,205" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- trailing SL steps -->
    <polyline points="250,360 250,300 320,300 320,255 370,255 370,240 420,240 420,205 520,205 520,180 660,180" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="miter"/>
    <!-- exit marker -->
    <circle cx="640" cy="180" r="8" fill="#a78bfa" stroke="#0b1220" stroke-width="3"/>
    <text x="500" y="110" font-size="14" fill="#c4b5fd" font-weight="600">Price reverses and hits the trailed SL</text>
    <line x1="560" y1="118" x2="635" y2="170" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- legend -->
    <g font-size="14">
      <line x1="60" y1="410" x2="95" y2="410" stroke="#22d3ee" stroke-width="3"/><text x="105" y="415" fill="#cbd5e1">Price</text>
      <line x1="180" y1="410" x2="215" y2="410" stroke="#34d399" stroke-width="3"/><text x="225" y="415" fill="#cbd5e1">Stop loss (moves up only)</text>
      <line x1="440" y1="410" x2="475" y2="410" stroke="#f87171" stroke-width="3"/><text x="485" y="415" fill="#cbd5e1">Initial SL</text>
    </g>
    <text x="30" y="445" font-size="13" fill="#6b7f95">Illustration only. The SL only moves when it improves by at least InpTrailStepPoints.</text>
  </g>
</svg>
